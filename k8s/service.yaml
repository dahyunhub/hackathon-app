apiVersion: v1
kind: Service
metadata:
  name: hackathon-app
  labels:
    app: hackathon-app
spec:
  type: LoadBalancer
  selector:
    app: hackathon-app       # Deployment 의 Pod label 과 같아야 한다
  ports:
    - name: http
      port: 80               # Load Balancer 가 받는 포트
      targetPort: 8000       # 컨테이너 포트
