name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:            # Actions 탭에서 손으로도 실행할 수 있다

permissions:
  id-token: write               # OIDC 토큰 발급에 필요하다
  contents: read

concurrency:
  group: deploy-main            # 배포가 겹치면 앞의 것을 끝까지 기다린다
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hackathon-app
  CLUSTER_NAME: hackathon-eks

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드와 push (SHA 태그)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: kubeconfig 연결
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: 배포
        run: |
          sed -i "s|image: .*hackathon-app:.*|image: $IMAGE|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl annotate deployment/hackathon-app kubernetes.io/change-cause="$GITHUB_SHA" --overwrite
          kubectl rollout status deployment/hackathon-app --timeout=180s

      - name: 외부 주소 출력
        run: kubectl get svc hackathon-app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
